name: Publish Quartz site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-design-quartz-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: self-hosted
    steps:
      - name: Checkout source docs
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build -d .
      - name: Publish generated site repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.SITE_DEPLOY_KEY }}
          external_repository: myriwe-bot/neon-champions-game-design-site
          publish_branch: main
          publish_dir: ./public
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Deploy game design Quartz site from ${{ github.sha }}
